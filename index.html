<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FreezingCC — Apps &amp; Projects</title>
  <style>
    :root {
      --bg: #fafafa;
      --surface: #ffffff;
      --text: #1d1d1f;
      --muted: #6e6e73;
      --accent: #0066cc;
      --border: #d2d2d7;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
    }
    .container { max-width: 760px; margin: 0 auto; padding: 64px 32px; }
    header { margin-bottom: 48px; }
    h1 { font-size: 2.5rem; margin: 0 0 8px; letter-spacing: -0.02em; font-weight: 700; }
    .subtitle { color: var(--muted); margin: 0; font-size: 1.125rem; }
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px 28px;
      margin-bottom: 16px;
      text-decoration: none;
      color: inherit;
      display: block;
      transition: border-color 0.15s ease, transform 0.15s ease;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .card h2 { margin: 0 0 8px; font-size: 1.25rem; font-weight: 600; }
    .card p { margin: 0; color: var(--muted); font-size: 0.95rem; }
    .tag {
      display: inline-block;
      font-size: 0.75rem;
      padding: 2px 8px;
      background: rgba(0, 102, 204, 0.1);
      color: var(--accent);
      border-radius: 4px;
      margin-right: 8px;
      font-weight: 500;
    }
    footer {
      margin-top: 64px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
      color: var(--muted);
      font-size: 0.875rem;
    }
    a { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>FreezingCC</h1>
      <p class="subtitle">Apps &amp; Projects</p>
    </header>

    <main>
      <a href="basketball-vp/" class="card">
        <h2>随手投篮 · Hoop Practice</h2>
        <p>
          <span class="tag">visionOS</span>
          Apple Vision Pro 投篮训练应用
        </p>
      </a>
      <a href="burrow/" class="card">
        <h2>Burrow</h2>
        <p>
          <span class="tag">iOS / iPadOS</span>
          自带 frp 服务器的远程 SSH / SFTP 客户端
        </p>
      </a>
      <a href="habitoo/" class="card">
        <h2>Habitoo</h2>
        <p>
          <span class="tag">iOS</span>
          把目标缩到今晚就能做到的 AI 微习惯教练
        </p>
      </a>
    </main>

    <footer>
      <p>Contact: <a href="mailto:freezing.myfriend@gmail.com">freezing.myfriend@gmail.com</a></p>
    </footer>
  </div>
</body>
</html>
